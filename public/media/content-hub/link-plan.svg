<svg xmlns="http://www.w3.org/2000/svg" width="560" height="790" viewBox="0 0 560 790" role="img" aria-labelledby="title desc"><title id="title">Useful links, without linking everything to everything</title><desc id="desc">Planning example for an imaginary residential cleaning business. All page roles and connections are also explained in the accompanying article.</desc><rect width="560" height="790" fill="#f5f7f6"/><rect x="0" y="0" width="560" height="7" rx="4" fill="#067878" stroke="#067878"/><text x="32" y="49" font-family="Avenir Next, Avenir, sans-serif" font-size="26" fill="#067878">LINK WITH A REASON.</text><rect x="32" y="80" width="496" height="95" rx="4" fill="#111416" stroke="#111416"/><text x="52" y="118" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="white">PILLAR CATEGORY</text><text x="52" y="151" font-family="Avenir Next, Avenir, sans-serif" font-size="25" fill="white">Regular home cleaning blogs</text><path d="M150 175L150 235" fill="none" stroke="#067878" stroke-width="3"/><path d="M410 175L410 235" fill="none" stroke="#067878" stroke-width="3"/><rect x="32" y="235" width="228" height="115" rx="4" fill="white" stroke="#067878"/><text x="48" y="278" font-family="Avenir Next, Avenir, sans-serif" font-size="24" fill="#111416">Inclusions</text><text x="48" y="313" font-family="Avenir Next, Avenir, sans-serif" font-size="21" fill="#525d64">What is covered?</text><rect x="300" y="235" width="228" height="115" rx="4" fill="white" stroke="#067878"/><text x="316" y="278" font-family="Avenir Next, Avenir, sans-serif" font-size="24" fill="#111416">Frequency</text><text x="316" y="313" font-family="Avenir Next, Avenir, sans-serif" font-size="21" fill="#525d64">How often?</text><path d="M260 292L300 292" fill="none" stroke="#e52283" stroke-width="3" stroke-dasharray="7 5"/><path d="M268 285L260 292" fill="none" stroke="#e52283" stroke-width="3"/><path d="M268 299L260 292" fill="none" stroke="#e52283" stroke-width="3"/><text x="32" y="390" font-family="Avenir Next, Avenir, sans-serif" font-size="23" fill="#111416">Frequency → inclusions:</text><text x="32" y="423" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="#525d64">check what you are comparing.</text><rect x="32" y="463" width="496" height="90" rx="4" fill="white" stroke="#cbd4d6"/><text x="52" y="500" font-family="Avenir Next, Avenir, sans-serif" font-size="23" fill="#067878">PRICE ARTICLE</text><text x="52" y="533" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="#111416">Explain the quote factors first.</text><path d="M280 553L280 605" fill="none" stroke="#e52283" stroke-width="3" stroke-dasharray="7 5"/><rect x="32" y="605" width="496" height="90" rx="4" fill="#111416" stroke="#111416"/><text x="52" y="642" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="white">SERVICE / QUOTE PAGE</text><text x="52" y="675" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="white">A relevant next action when ready.</text><text x="32" y="739" font-family="Avenir Next, Avenir, sans-serif" font-size="21" fill="#067878">Teal: category ↔ its blogs</text><text x="32" y="773" font-family="Avenir Next, Avenir, sans-serif" font-size="20" fill="#525d64">Dashed: contextual or commercial next step</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 740" role="img" aria-labelledby="title desc"><title id="title">Five campaign checkpoints</title><desc id="desc">Submission, approval, delivery, correct measurement and useful business outcomes are separate states. Verify each rather than treating approval as success.</desc><rect width="560" height="740" fill="#f6f7f5"/><style>text{font-family:Arial,sans-serif;fill:#14191b}.label{font-size:25px;font-weight:700}.note{font-size:21px}.rule{stroke:#aab8b8;stroke-width:2}</style><text x="28" y="48" class="label">Five different campaign checkpoints</text><text x="28" y="115" class="label">01</text><text x="90" y="115" class="label">Submitted</text><text x="90" y="151" class="note">The platform received the campaign.</text><line x1="28" y1="181" x2="532" y2="181" class="rule"/><text x="28" y="240" class="label">02</text><text x="90" y="240" class="label">Approved</text><text x="90" y="276" class="note">The campaign passed its review.</text><line x1="28" y1="306" x2="532" y2="306" class="rule"/><text x="28" y="365" class="label">03</text><text x="90" y="365" class="label">Delivering</text><text x="90" y="401" class="note">Ads are actually being served.</text><line x1="28" y1="431" x2="532" y2="431" class="rule"/><text x="28" y="490" class="label">04</text><text x="90" y="490" class="label">Measured</text><text x="90" y="526" class="note">Events are recorded correctly.</text><line x1="28" y1="556" x2="532" y2="556" class="rule"/><text x="28" y="615" class="label">05</text><text x="90" y="615" class="label">Useful</text><text x="90" y="651" class="note">Real outcomes justify the cost.</text><line x1="28" y1="681" x2="532" y2="681" class="rule"/></svg>
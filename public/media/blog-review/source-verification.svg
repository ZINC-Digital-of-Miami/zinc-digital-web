<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc"><title id="title">Turn a citation into checked evidence</title><desc id="desc">01 / Discover. Define the question and boundaries. Find an inspectable original URL. Record the tool and research date. 02 / Verify. Open the source and locate the passage. Check scope, dates and independence. Unsupported claim? Correct or remove. 03 / Decide. Separate fact from interpretation. Keep the limitation with the finding. Assign the action and review date</desc><rect width="360" height="1160" fill="#f5f7f7"/><g font-family="Arial, sans-serif" fill="#162625"><text x="20" y="33" font-size="14" letter-spacing="1.2">ZINC / FIELD REFERENCE</text><path d="M20 50H340" stroke="#167c70" stroke-width="3"/><rect x="12" y="80" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="112" font-size="20" font-weight="700">01 / Discover</text><text x="24" y="168" font-size="20">Define the question and</text><text x="24" y="196" font-size="20">boundaries</text><text x="24" y="236" font-size="20">Find an inspectable original</text><text x="24" y="264" font-size="20">URL</text><text x="24" y="304" font-size="20">Record the tool and research</text><text x="24" y="332" font-size="20">date</text><path d="M180 396v18m-6-6 6 6 6-6" fill="none" stroke="#167c70" stroke-width="2"/><rect x="12" y="420" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="452" font-size="20" font-weight="700">02 / Verify</text><text x="24" y="508" font-size="20">Open the source and locate</text><text x="24" y="536" font-size="20">the passage</text><text x="24" y="576" font-size="20">Check scope, dates and</text><text x="24" y="604" font-size="20">independence</text><text x="24" y="644" font-size="20">Unsupported claim? Correct or</text><text x="24" y="672" font-size="20">remove</text><path d="M180 736v18m-6-6 6 6 6-6" fill="none" stroke="#167c70" stroke-width="2"/><rect x="12" y="760" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="792" font-size="20" font-weight="700">03 / Decide</text><text x="24" y="848" font-size="20">Separate fact from</text><text x="24" y="876" font-size="20">interpretation</text><text x="24" y="916" font-size="20">Keep the limitation with the</text><text x="24" y="944" font-size="20">finding</text><text x="24" y="984" font-size="20">Assign the action and review</text><text x="24" y="1012" font-size="20">date</text><text x="20" y="1110" font-size="18">A fluent answer starts the</text><text x="20" y="1136" font-size="18">check</text></g></svg>

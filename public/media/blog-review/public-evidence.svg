<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc"><title id="title">Keep the inference visible</title><desc id="desc">01 / Record what is public. Exact offer, price and stated terms. Source URL and observation date. Label the business’s own claims. 02 / Bound the comparison. Match scope, currency and conditions. Leave missing prices unknown. Do not infer revenue or private spend. 03 / Test your own explanation. Choose one useful hypothesis. Define your baseline and owner. Review your result, not their private data</desc><rect width="360" height="1160" fill="#f5f7f7"/><g font-family="Arial, sans-serif" fill="#162625"><text x="20" y="33" font-size="14" letter-spacing="1.2">ZINC / FIELD REFERENCE</text><path d="M20 50H340" stroke="#167c70" stroke-width="3"/><rect x="12" y="80" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="112" font-size="20" font-weight="700">01 / Record what is public</text><text x="24" y="168" font-size="20">Exact offer, price and stated</text><text x="24" y="196" font-size="20">terms</text><text x="24" y="236" font-size="20">Source URL and observation</text><text x="24" y="264" font-size="20">date</text><text x="24" y="304" font-size="20">Label the business’s own</text><text x="24" y="332" font-size="20">claims</text><path d="M180 396v18m-6-6 6 6 6-6" fill="none" stroke="#167c70" stroke-width="2"/><rect x="12" y="420" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="452" font-size="20" font-weight="700">02 / Bound the comparison</text><text x="24" y="508" font-size="20">Match scope, currency and</text><text x="24" y="536" font-size="20">conditions</text><text x="24" y="576" font-size="20">Leave missing prices unknown</text><text x="24" y="616" font-size="20">Do not infer revenue or</text><text x="24" y="644" font-size="20">private spend</text><path d="M180 736v18m-6-6 6 6 6-6" fill="none" stroke="#167c70" stroke-width="2"/><rect x="12" y="760" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="792" font-size="20" font-weight="700">03 / Test your own</text><text x="24" y="818" font-size="20" font-weight="700">explanation</text><text x="24" y="848" font-size="20">Choose one useful hypothesis</text><text x="24" y="888" font-size="20">Define your baseline and</text><text x="24" y="916" font-size="20">owner</text><text x="24" y="956" font-size="20">Review your result, not their</text><text x="24" y="984" font-size="20">private data</text><text x="20" y="1110" font-size="18">Public observation is not</text><text x="20" y="1136" font-size="18">private performance</text></g></svg>

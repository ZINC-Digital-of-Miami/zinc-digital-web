name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
      VIPS_CONCURRENCY: '1'
      UV_THREADPOOL_SIZE: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          PUBLIC_ANALYTICS: 'on'
          VERCEL_ENV: production
      - run: node scripts/check-site.mjs --analytics=on

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc"><title id="title">Count origins before agreement</title><desc id="desc">01 / Trace the original. Survey A → article B → article C. One study, three publications. Record the shared family ID. 02 / Compare a separate record. Store log D has its own origin. Check population, dates and measure. Different scope may limit comparison. 03 / Make the narrow decision. Agreement, contradiction or unknown. Retain limitations and minority findings. Name the next check and owner</desc><rect width="360" height="1160" fill="#f5f7f7"/><g font-family="Arial, sans-serif" fill="#162625"><text x="20" y="33" font-size="14" letter-spacing="1.2">ZINC / FIELD REFERENCE</text><path d="M20 50H340" stroke="#167c70" stroke-width="3"/><rect x="12" y="80" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="112" font-size="20" font-weight="700">01 / Trace the original</text><text x="24" y="168" font-size="20">Survey A → article B →</text><text x="24" y="196" font-size="20">article C</text><text x="24" y="236" font-size="20">One study, three publications</text><text x="24" y="276" font-size="20">Record the shared family ID</text><path d="M180 396v18m-6-6 6 6 6-6" fill="none" stroke="#167c70" stroke-width="2"/><rect x="12" y="420" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="452" font-size="20" font-weight="700">02 / Compare a separate</text><text x="24" y="478" font-size="20" font-weight="700">record</text><text x="24" y="508" font-size="20">Store log D has its own</text><text x="24" y="536" font-size="20">origin</text><text x="24" y="576" font-size="20">Check population, dates and</text><text x="24" y="604" font-size="20">measure</text><text x="24" y="644" font-size="20">Different scope may limit</text><text x="24" y="672" font-size="20">comparison</text><path d="M180 736v18m-6-6 6 6 6-6" fill="none" stroke="#167c70" stroke-width="2"/><rect x="12" y="760" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="792" font-size="20" font-weight="700">03 / Make the narrow decision</text><text x="24" y="848" font-size="20">Agreement, contradiction or</text><text x="24" y="876" font-size="20">unknown</text><text x="24" y="916" font-size="20">Retain limitations and</text><text x="24" y="944" font-size="20">minority findings</text><text x="24" y="984" font-size="20">Name the next check and owner</text><text x="20" y="1110" font-size="18">Repeated summaries are one</text><text x="20" y="1136" font-size="18">evidence family</text></g></svg>

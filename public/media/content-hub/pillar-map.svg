<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1010" viewBox="0 0 560 1010" role="img" aria-labelledby="title desc"><title id="title">A pillar with distinct supporting answers</title><desc id="desc">Planning example for an imaginary residential cleaning business. All page roles and connections are also explained in the accompanying article.</desc><rect width="560" height="1010" fill="#f5f7f6"/><rect x="0" y="0" width="560" height="7" rx="4" fill="#067878" stroke="#067878"/><text x="32" y="50" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="#067878">ONE SUBJECT. CLEAR PAGE ROLES.</text><rect x="32" y="78" width="496" height="90" rx="4" fill="#111416" stroke="#111416"/><text x="52" y="114" font-family="Avenir Next, Avenir, sans-serif" font-size="23" fill="white">Business goal</text><text x="52" y="146" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="white">Suitable regular-cleaning enquiries</text><path d="M280 168L280 201" fill="none" stroke="#067878" stroke-width="3"/><rect x="32" y="202" width="496" height="125" rx="4" fill="white" stroke="#067878"/><text x="52" y="240" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="#067878">PILLAR CATEGORY</text><text x="52" y="276" font-family="Avenir Next, Avenir, sans-serif" font-size="25" fill="#111416">Regular home cleaning</text><text x="52" y="308" font-family="Avenir Next, Avenir, sans-serif" font-size="21" fill="#525d64">Aligned with the primary service</text><path d="M49 327L49 770" fill="none" stroke="#067878" stroke-width="3"/><path d="M49 387L66 387" fill="none" stroke="#067878" stroke-width="3"/><rect x="66" y="350" width="462" height="74" rx="4" fill="white" stroke="#cbd4d6"/><text x="84" y="381" font-family="Avenir Next, Avenir, sans-serif" font-size="25" fill="#111416">Choosing guide</text><text x="84" y="410" font-family="Avenir Next, Avenir, sans-serif" font-size="22" fill="#525d64">How to select the right service</text><path d="M49 471L66 47
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc"><title id="title">A platform change moves responsibility</title><desc id="desc">01 / Address the immediate issue. Confirm current PHP fixes. Test forms, logins and checkout. Save who checked and when. 02 / Choose the editing arrangement. Keep WordPress: maintain PHP too. Replace it: test the new editor. Inventory every required function. 03 / Verify the replacement. Check old links and public pages. Confirm the receiving form record. Name support and recovery owners</desc><rect width="360" height="1160" fill="#f5f7f7"/><g font-family="Arial, sans-serif" fill="#162625"><text x="20" y="33" font-size="14" letter-spacing="1.2">ZINC / FIELD REFERENCE</text><path d="M20 50H340" stroke="#167c70" stroke-width="3"/><rect x="12" y="80" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="112" font-size="20" font-weight="700">01 / Address the immediate</text><text x="24" y="138" font-size="20" font-weight="700">issue</text><text x="24" y="168" font-size="20">Confirm current PHP fixes</text><text x="24" y="208" font-size="20">Test forms, logins and</text><text x="24" y="236" font-size="20">checkout</text><text x="24" y="276" font-size="20">Save who checked and when</text><path d="M180 396v18m-6-6 6 6 6-6" fill="none" stroke="#167c70" stroke-width="2"/><rect x="12" y="420" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="452" font-size="20" font-weight="700">02 / Choose the editing</text><text x="24" y="478" font-size="20" font-weight="700">arrangement</text><text x="24" y="508" font-size="20">Keep WordPress: maintain PHP</text><text x="24" y="536" font-size="20">too</text><text x="24" y="576" font-size="20">Replace it: test the new</text><text x="24" y="604" font-size="20">editor</text><text x="24" y="644" font-size="20">Inventory every required</text><text x="24" y="672" font-size="20">function</text><path d="M180 736v18m-6-6 6 6 6-6" fill="none" stroke="#167c70" stroke-width="2"/><rect x="12" y="760" width="336" height="310" rx="4" fill="#fff" stroke="#bbc9c7"/><text x="24" y="792" font-size="20" font-weight="700">03 / Verify the replacement</text><text x="24" y="848" font-size="20">Check old links and public</text><text x="24" y="876" font-size="20">pages</text><text x="24" y="916" font-size="20">Confirm the receiving form</text><text x="24" y="944" font-size="20">record</text><text x="24" y="984" font-size="20">Name support and recovery</text><text x="24" y="1012" font-size="20">owners</text><text x="20" y="1110" font-size="18">Responsibilities still need</text><text x="20" y="1136" font-size="18">an owner</text></g></svg>

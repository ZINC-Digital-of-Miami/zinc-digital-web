<svg xmlns="http://www.w3.org/2000/svg" width="560" height="930" viewBox="0 0 560 930" role="img" aria-labelledby="title desc"><title id="title">From an $86 order to an $18 media ceiling</title><desc id="desc">Illustrative USD per original first order. 86 dollars retained revenue minus 50 dollars order costs equals 36 dollars contribution. Subtract 6 dollars other acquisition cost and 12 dollars retained for overhead and profit to leave an 18 dollar media ceiling.</desc><rect width="560" height="930" fill="#f5f7f6"/><rect width="560" height="7" fill="#067878"/><text x="28" y="49" font-family="Avenir Next, Avenir, sans-serif" font-size="22" font-weight="700" fill="#067878">WHAT CAN THE ORDER FUND?</text><text x="28" y="83" font-family="Avenir Next, Avenir, sans-serif" font-size="19" font-weight="400" fill="#525d64">Illustrative USD · per original first order</text><rect x="24" y="110" width="512" height="103" rx="5" fill="white"/><text x="42" y="144" font-family="Avenir Next, Avenir, sans-serif" font-size="21" font-weight="700" fill="#111416">Revenue you keep</text><text x="510" text-anchor="end" y="150" font-family="Avenir Next, Avenir, sans-serif" font-size="27" font-weight="700" fill="#111416">$86</text><text x="42" y="176" font-family="Avenir Next, Avenir, sans-serif" font-size="18" font-weight="400" fill="#525d64">After discounts/refunds; includes net shipping</text><rect x="24" y="229" width="512" height="103" rx="5" fill="white"/><text x="42" y="263" font-family="Avenir Next, Avenir, sans-serif" font-size="21" font-weight="700" fill="#111416">Order costs</text><text x="510" text-anchor="end" y="269" font-family="Avenir Next, Avenir, sans-serif" font-size="27" font-weight="700" fill="#111416">−$50</text><text x="42" y="295" font-family="Avenir Next, Avenir, sans-serif" font-size="18" font-weight="400" fill="#525d64">Product, delivery, packing, fees and returns</text><rect x="24" y="348" width="512" height="103" rx="5" fill="#e0eeeb"/><text x="42" y="382" font-family="Avenir Next, Avenir, sans-serif" font-size="21" font-weight="700" fill="#111416">Before acquisition</text><text x="510" text-anchor="end" y="388" font-family="Avenir Next, Avenir, sans-serif" font-size="27" font-weight="700" fill="#111416">$36</text><text x="42" y="414" font-family="Avenir Next, Avenir, sans-serif" font-size="18" font-weight="400" fill="#525d64">Contribution, not net profit</text><rect x="24" y="467" width="512" height="103" rx="5" fill="white"/><text x="42" y="501" font-family="Avenir Next, Avenir, sans-serif" font-size="21" font-weight="700" fill="#111416">Other acquisition</text><text x="510" text-anchor="end" y="507" font-family="Avenir Next, Avenir, sans-serif" font-size="27" font-weight="700" fill="#111416">−$6</text><text x="42" y="533" font-family="Avenir Next, Avenir, sans-serif" font-size="18" font-weight="400" fill="#525d64">Creative and agency allocation</text><rect x="24" y="586" width="512" height="103" rx="5" fill="white"/><text x="42" y="620" font-family="Avenir Next, Avenir, sans-serif" font-size="21" font-weight="700" fill="#111416">Keep for the business</text><text x="510" text-anchor="end" y="626" font-family="Avenir Next, Avenir, sans-serif" font-size="27" font-weight="700" fill="#111416">−$12</text><text x="42" y="652" font-family="Avenir Next, Avenir, sans-serif" font-size="18" font-weight="400" fill="#525d64">Chosen allowance for overhead and profit</text><rect x="24" y="705" width="512" height="103" rx="5" fill="#111416"/><text x="42" y="739" font-family="Avenir Next, Avenir, sans-serif" font-size="21" font-weight="700" fill="white">Available for media</text><text x="510" text-anchor="end" y="745" font-family="Avenir Next, Avenir, sans-serif" font-size="27" font-weight="700" fill="white">$18</text><text x="42" y="771" font-family="Avenir Next, Avenir, sans-serif" font-size="18" font-weight="400" fill="#e0eeeb">A ceiling to test below, not a spending order</text><text x="28" y="866" font-family="Avenir Next, Avenir, sans-serif" font-size="18" font-weight="400" fill="#525d64">Same orders. Same revenue basis. No double counting.</text><text x="28" y="900" font-family="Avenir Next, Avenir, sans-serif" font-size="18" font-weight="400" fill="#525d64">The $12 allowance is a choice, not a benchmark.</text></svg>
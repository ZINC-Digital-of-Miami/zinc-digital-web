<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="title desc"><title id="title">A category houses the article; links serve the reader</title><desc id="desc">The business intelligence service aligns with its blog category. The dashboard preparation article belongs to that category. A contextual link explains metric definitions; an optional commercial next step leads to the service.</desc><rect width="560" height="760" fill="#f6f7f5"/><style>text{font-family:Arial,sans-serif;fill:#14191b}.title{font-size:25px;font-weight:700}.label{font-size:23px}.note{font-size:21px}</style><text x="28" y="35" style="font-size:16px;fill:#086e72">COMMERCIAL OFFER</text><text x="28" y="73" class="title">Business intelligence service</text><text x="28" y="111" class="note">Explains scope and how to enquire.</text><path d="M48 131v42m-7-7 7 7 7-7" fill="none" stroke="#086e72" stroke-width="3"/><text x="28" y="213" style="font-size:16px;fill:#086e72">PILLAR / BLOG CATEGORY</text><text x="28" y="251" class="title">Business intelligence articles</text><text x="28" y="289" class="note">Houses articles on the main topic.</text><path d="M48 309v42m-7-7 7 7 7-7" fill="none" stroke="#086e72" stroke-width="3"/><text x="28" y="391" style="font-size:16px;fill:#086e72">ARTICLE WITHIN THE CATEGORY</text><text x="28" y="429" class="title">Prepare to buy a dashboard</text><text x="28" y="467" class="note">Helps the owner write requirements.</text><path d="M28 510h504" stroke="#9caaad"/><text x="28" y="552" class="title">Two useful next steps</text><text x="28" y="596" class="label">Need definitions? Read the supporting guide.</text><text x="28" y="638" class="label">Need help? Review the service offer.</text><text x="28" y="699" class="note">The guide is not the category.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 850" role="img" aria-labelledby="title desc"><title id="title">Canonical and redirect decisions</title><desc id="desc">Choose a canonical for equivalent accessible pages, a redirect for a replaced URL, or preserve distinct useful pages. Indexing restrictions do not protect private content.</desc><rect width="560" height="850" fill="#f6f7f5"/><style>text{font-family:Arial,sans-serif;fill:#14191b}.label{font-size:25px;font-weight:700}.note{font-size:21px}.rule{stroke:#aab8b8;stroke-width:2}</style><text x="28" y="48" class="label">Which URL should represent the page?</text><line x1="28" y1="80" x2="532" y2="80" class="rule"/><text x="28" y="120" class="label">Equivalent pages, both needed</text><rect x="28" y="140" width="310" height="48" fill="#086e72"/><text x="44" y="172" style="font-size:23px;fill:white">Canonical signal</text><text x="28" y="223" class="note">Keep the preferred URL consistent.</text><line x1="28" y1="265" x2="532" y2="265" class="rule"/><text x="28" y="305" class="label">Old URL permanently replaced</text><rect x="28" y="325" width="310" height="48" fill="#086e72"/><text x="44" y="357" style="font-size:23px;fill:white">Relevant redirect</text><text x="28" y="408" class="note">Test the destination and avoid loops.</text><line x1="28" y1="450" x2="532" y2="450" class="rule"/><text x="28" y="490" class="label">Distinct useful pages</text><rect x="28" y="510" width="310" height="48" fill="#086e72"/><text x="44" y="542" style="font-size:23px;fill:white">Keep and clarify</text><text x="28" y="593" class="note">Products are not their collections.</text><line x1="28" y1="635" x2="532" y2="635" class="rule"/><text x="28" y="675" class="label">Page should stay out of Search</text><rect x="28" y="695" width="310" height="48" fill="#086e72"/><text x="44" y="727" style="font-size:23px;fill:white">Indexing decision</text><text x="28" y="778" class="note">Protect private content with access</text><text x="28" y="805" class="note">controls.</text></svg>